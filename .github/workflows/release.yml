name: Release

on:
  push:
    tags:
      - "v*"
  # Dry run: builds and uploads the artifacts without publishing anything.
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on the dry-run build, like 0.2.0
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  XCODE_VERSION: "27.2"

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - name: iOS
            destination: generic/platform=iOS
          - name: Mac
            destination: generic/platform=macOS,variant=Mac Catalyst

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the build number is the commit count

      - name: Read version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::'$version' isn't a version like 0.2.0 (tags look like v0.2.0)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      # Xcode ships the Metal toolchain as a separate component; the app has shaders.
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Archive
        run: |
          xcodebuild archive \
            -project App/Helio.xcodeproj \
            -scheme Helio \
            -configuration Release \
            -destination '${{ matrix.destination }}' \
            -archivePath "$RUNNER_TEMP/Helio.xcarchive" \
            -skipPackagePluginValidation \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD"

      # Unsigned: sideloading tools (SideStore, AltStore, Sideloadly) re-sign it with the
      # user's Apple ID. Feed metadata is read from the built app.
      - name: Package IPA
        if: matrix.name == 'iOS'
        run: |
          mkdir -p dist "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/Helio.xcarchive/Products/Applications/Helio.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/dist/Helio-$VERSION.ipa" Payload)
          .github/scripts/app-metadata.sh "$RUNNER_TEMP/ipa/Payload/Helio.app" > dist/metadata.json
          cat dist/metadata.json

      # Ad-hoc signed so it runs on Apple Silicon. Without a Developer ID it isn't notarized
      # and has no keychain access.
      - name: Package Mac app
        if: matrix.name == 'Mac'
        run: |
          mkdir -p dist
          app="$RUNNER_TEMP/Helio.xcarchive/Products/Applications/Helio.app"
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" "dist/Helio-$VERSION-mac.zip"

      # Sparkle trusts an update by this signature over the zip, made with the private half of
      # the app's SUPublicEDKey; the ad-hoc code signature changes with every build. Without
      # the secret the release still ships, but the appcast isn't updated.
      - name: Sign Mac update
        if: matrix.name == 'Mac'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_PRIVATE_KEY isn't set, so the Mac app won't be offered this update"
            exit 0
          fi
          zip="dist/Helio-$VERSION-mac.zip"
          signature=$(printf '%s' "$SPARKLE_PRIVATE_KEY" \
            | "$RUNNER_TEMP/packages/artifacts/sparkle/Sparkle/bin/sign_update" --ed-key-file - -p "$zip")
          plutil -convert json -o - "$RUNNER_TEMP/Helio.xcarchive/Products/Applications/Helio.app/Contents/Info.plist" \
            | jq --arg signature "$signature" --argjson length "$(stat -f %z "$zip")" '{
              version: .CFBundleShortVersionString,
              buildVersion: .CFBundleVersion,
              minOSVersion: .LSMinimumSystemVersion,
              edSignature: $signature,
              length: $length
            }' > dist/mac-update.json
          cat dist/mac-update.json

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish release and feed
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" \
            --jq .body > notes.md
          cat > body.md <<EOF
          ## Install

          **iPhone and iPad:** add the source \`https://sozercan.github.io/helio/source.json\` in SideStore or AltStore, or sideload \`Helio-$version.ipa\` with Sideloadly. Sideloaded builds can't use iCloud, so data stays on the device.

          **Mac:** unzip \`Helio-$version-mac.zip\`, move Helio to Applications, then allow it under System Settings > Privacy & Security on first launch. After that, Helio > Check for Updates… installs new versions. This build isn't notarized and has no keychain access, so it asks you to sign in to Reddit again on each launch.

          EOF
          cat notes.md >> body.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Helio $version" --notes-file body.md \
            "dist/Helio-$version.ipa" "dist/Helio-$version-mac.zip"

      - name: Update source feed and appcast
        run: |
          version="${GITHUB_REF_NAME#v}"
          ipa="dist/Helio-$version.ipa"
          git fetch --depth 1 origin gh-pages
          git worktree add pages FETCH_HEAD
          .github/scripts/update-source.sh \
            --source pages/source.json \
            --metadata dist/metadata.json \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Helio-$version.ipa" \
            --size "$(stat -c %s "$ipa")" \
            --notes notes.md
          # Only when the Mac build was signed for Sparkle (see "Sign Mac update").
          if [ -f dist/mac-update.json ]; then
            .github/scripts/update-appcast.sh \
              --appcast pages/appcast.xml \
              --update dist/mac-update.json \
              --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Helio-$version-mac.zip" \
              --release-page "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
              --notes notes.md
          fi
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          [ -f appcast.xml ] && git add appcast.xml
          git commit -m "Add Helio $version to the source feed and appcast"
          git push origin HEAD:gh-pages
