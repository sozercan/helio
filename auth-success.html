<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Helio - Redirecting...</title>
<style>
  body { font-family: -apple-system, sans-serif; text-align: center; padding: 60px 20px; color: #333; }
  a { color: #0066cc; }
</style>
</head>
<body>
<p>Redirecting to Helio...</p>
<p>If the app doesn't open, <a id="link" href="#">tap here</a>.</p>
<script>
  // Reddit only accepts https redirect URIs for web apps, so hand the OAuth reply to the app's URL scheme.
  var appUrl = 'helioapp://auth-success' + window.location.search;
  document.getElementById('link').href = appUrl;
  window.location.replace(appUrl);
</script>
</body>
</html>
